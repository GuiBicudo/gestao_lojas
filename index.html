<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Lojas — Impressão 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">◇</span>
      <div class="brand-text">
        <strong>Gestão de Lojas</strong>
        <span>Impressão 3D &amp; Revenda</span>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer">
      <button id="btn-export" class="ghost-btn">Exportar backup</button>
      <label class="ghost-btn" for="file-import">Importar backup</label>
      <input type="file" id="file-import" accept="application/json" hidden>
      <p class="hint">Os dados ficam salvos neste navegador. Exporte um backup de vez em quando.</p>
    </div>
  </aside>

  <main class="content" id="content">
    <!-- injetado via JS -->
  </main>

</div>

<template id="tpl-store">
  <section class="panel">
    <header class="panel-header">
      <div>
        <h1 class="store-title"></h1>
        <p class="panel-sub">Preencha os campos de cada produto. Os valores calculados atualizam sozinhos.</p>
      </div>
      <div class="panel-actions">
        <button class="primary-btn" data-action="add-row">+ Novo produto</button>
        <button class="ghost-btn small" data-action="export-csv">Exportar CSV</button>
      </div>
    </header>
    <div class="table-wrap">
      <table class="data-table store-table">
        <thead>
          <tr>
            <th class="col-produto">Produto</th>
            <th>Tipo</th>
            <th>Impressora</th>
            <th>Filamento</th>
            <th class="num">Venda (R$)</th>
            <th class="num">Recebido (R$)</th>
            <th class="num calc">Taxa (R$)</th>
            <th class="num calc">Taxa (%)</th>
            <th class="num">Peso (g)</th>
            <th class="num">Tempo (h)</th>
            <th class="num calc">Filamento (R$)</th>
            <th class="num calc">Energia (R$)</th>
            <th class="num">Embalagem (R$)</th>
            <th class="num">Gasto p/ Levar (R$)</th>
            <th class="num calc">Custo Total (R$)</th>
            <th class="num calc">Lucro (R$)</th>
            <th class="num calc">Margem</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</template>

<script src="app.js"></script>
</body>
</html>
